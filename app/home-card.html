<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ogee</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=block"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background:
          radial-gradient(700px 500px at 100% 100%, rgb(124 92 255 / 0.3), transparent 70%), #09090b;
        color: #fafafa;
        font-family: Geist, system-ui, sans-serif;
        display: grid;
        grid-template-columns: 470px 1fr;
        align-items: center;
        gap: 40px;
        padding: 0 64px 0 72px;
        position: relative;
      }
      body::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgb(255 255 255 / 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgb(255 255 255 / 0.045) 1px, transparent 1px);
        background-size: 60px 60px;
      }
      section,
      .stage {
        position: relative;
      }
      .mark {
        display: flex;
        align-items: center;
        gap: 18px;
        font-size: 84px;
        font-weight: 600;
        letter-spacing: -0.05em;
      }
      .mark svg {
        width: 72px;
        height: 72px;
      }
      h1 {
        margin-top: 34px;
        font-size: 58px;
        font-weight: 600;
        letter-spacing: -0.04em;
        line-height: 1.04;
      }
      h1 em {
        font-style: normal;
        color: #a78bfa;
      }
      p.sub {
        margin-top: 24px;
        font-size: 28px;
        line-height: 1.35;
        color: #a1a1aa;
      }
      .term {
        border: 1px solid #27272a;
        border-radius: 20px;
        background: rgb(17 17 19 / 0.92);
        padding: 22px 28px;
        font-family: "Geist Mono", ui-monospace, monospace;
        font-size: 24px;
        line-height: 1.6;
        color: #d4d4d8;
      }
      .term .prompt {
        color: #71717a;
      }
      .term .out {
        color: #a78bfa;
        opacity: 0;
      }
      .caret {
        display: inline-block;
        width: 12px;
        height: 26px;
        vertical-align: -4px;
        background: #a78bfa;
      }
      .bubble {
        margin-top: 22px;
        margin-left: 40px;
        border-radius: 22px 22px 22px 6px;
        background: #1c1c21;
        border: 1px solid #2e2e35;
        padding: 14px;
        opacity: 0;
        translate: 0 30px;
        scale: 0.96;
        transform-origin: 0 100%;
      }
      .bubble .head {
        padding: 2px 6px 12px;
        border-left: 4px solid #7c5cff;
        margin-bottom: 12px;
        padding-left: 14px;
      }
      .bubble b {
        display: block;
        font-size: 22px;
        font-weight: 600;
      }
      .bubble small {
        font-size: 19px;
        color: #a1a1aa;
      }
      .bubble img {
        display: block;
        width: 100%;
        border-radius: 12px;
      }
    </style>
  </head>
  <body>
    <section>
      <p class="mark">
        <svg viewBox="0 0 72 72" fill="none">
          <rect width="72" height="72" rx="18" fill="#7c5cff" />
          <path
            d="M16 56V44c0-12 20-12 20-28 0 16 20 16 20 28v12"
            stroke="#fff"
            stroke-width="6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        ogee
      </p>
      <h1>Inline HTML artifacts.<br /><em>Wherever you are.</em></h1>
      <p class="sub">iMessage, Telegram, WhatsApp, Slack, Discord.</p>
    </section>
    <div class="stage">
      <div class="term">
        <div>
          <span class="prompt">$ </span><span id="typed"></span
          ><span class="caret" id="caret"></span>
        </div>
        <div class="out" id="out">link ready, preview attached</div>
      </div>
      <div class="bubble" id="bubble">
        <div class="head">
          <b>Weekly active users</b><small>48,213, up 12.4% vs last week</small>
        </div>
        <img
          src="https://0wvdcxj91koxbvd6.public.blob.vercel-storage.com/bddf81d86b29/preview.png"
          alt=""
        />
      </div>
    </div>
    <script>
      const command = "npx ogee card.html";
      const typed = document.getElementById("typed");
      const start = performance.now();
      const ease = (t) => 1 - (1 - Math.min(Math.max(t, 0), 1)) ** 3;
      const render = (ms) => {
        typed.textContent = command.slice(0, Math.floor(ms / 55));
        document.getElementById("caret").style.opacity =
          ms < 1600 || Math.floor(ms / 450) % 2 ? 1 : 0;
        document.getElementById("out").style.opacity = ease((ms - 1300) / 250);
        const pop = ease((ms - 1700) / 500);
        const bubble = document.getElementById("bubble");
        bubble.style.opacity = pop;
        bubble.style.translate = `0 ${(1 - pop) * 30}px`;
        bubble.style.scale = 0.96 + pop * 0.04;
        return ms < 2400;
      };
      const tick = () => render(performance.now() - start) && requestAnimationFrame(tick);
      tick();
    </script>
  </body>
</html>
