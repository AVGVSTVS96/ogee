<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Agent run: fix flaky checkout test</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=block"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background:
          radial-gradient(800px 480px at 100% 0%, rgb(124 92 255 / 0.22), transparent 70%), #09090b;
        color: #fafafa;
        font-family: Geist, system-ui, sans-serif;
        padding: 60px 72px 56px;
        display: grid;
        grid-template-columns: 1fr 560px;
        grid-template-rows: 1fr auto;
        column-gap: 56px;
      }
      .mono {
        font-family: "Geist Mono", ui-monospace, monospace;
        font-variant-numeric: tabular-nums;
      }
      .label {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 28px;
        color: #a1a1aa;
      }
      .label i {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #7c5cff;
        box-shadow: 0 0 0 7px rgb(124 92 255 / 0.25);
      }
      .done .label i {
        background: #22c55e;
        box-shadow: 0 0 0 7px rgb(34 197 94 / 0.22);
      }
      h1 {
        margin-top: 26px;
        font-size: 64px;
        font-weight: 600;
        letter-spacing: -0.035em;
        line-height: 1.05;
      }
      .clock {
        margin-top: 40px;
        font-size: 92px;
        font-weight: 500;
        letter-spacing: -0.04em;
        font-variant-numeric: tabular-nums;
        color: #e4e4e7;
      }
      .clock small {
        display: block;
        font-family: Geist, system-ui, sans-serif;
        font-size: 26px;
        letter-spacing: 0;
        color: #71717a;
        margin-top: 6px;
      }
      ol {
        list-style: none;
        padding: 0;
        align-self: center;
      }
      li {
        display: flex;
        align-items: center;
        gap: 22px;
        height: 78px;
        font-size: 32px;
        color: #52525b;
      }
      li .icon {
        flex: none;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 3px solid #3f3f46;
        display: grid;
        place-items: center;
      }
      li span {
        flex: 1;
      }
      li small {
        font-size: 24px;
        color: #71717a;
        opacity: 0;
      }
      li.running {
        color: #fafafa;
      }
      li.running .icon {
        border-color: rgb(124 92 255 / 0.3);
        border-top-color: #a78bfa;
        rotate: var(--spin);
      }
      li.ok {
        color: #d4d4d8;
      }
      li.ok .icon {
        border: 0;
        background: rgb(34 197 94 / 0.16);
        color: #4ade80;
      }
      li.ok small {
        opacity: 1;
      }
      li .icon svg {
        width: 24px;
        height: 24px;
        display: none;
      }
      li.ok .icon svg {
        display: block;
      }
      footer {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        gap: 28px;
        margin-top: 36px;
      }
      .track {
        flex: 1;
        height: 14px;
        border-radius: 999px;
        background: #27272a;
        overflow: hidden;
      }
      .fill {
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #7c5cff, #a78bfa);
      }
      .done .fill {
        background: linear-gradient(90deg, #22c55e, #4ade80);
      }
      .pct {
        width: 100px;
        text-align: right;
        font-size: 30px;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <section>
      <p class="label"><i></i><span id="state">agent running</span></p>
      <h1>Fix flaky checkout test</h1>
      <p class="clock"><span id="clock">0:00</span><small>elapsed</small></p>
    </section>
    <ol id="steps"></ol>
    <footer>
      <div class="track"><div class="fill" id="fill"></div></div>
      <span class="pct mono" id="pct">0%</span>
    </footer>
    <script>
      const steps = [
        ["Read 14 files", "0:06"],
        ["Reproduce failure", "0:19"],
        ["Patch race in cart.ts", "0:31"],
        ["Run 214 tests", "0:52"],
        ["Open PR #482", "0:58"],
      ];
      const playMs = 3200;
      const runSeconds = 58;
      const check =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
      const list = document.getElementById("steps");
      list.innerHTML = steps
        .map(
          ([name, at]) =>
            `<li><b class="icon">${check}</b><span>${name}</span><small class="mono">${at}</small></li>`,
        )
        .join("");
      const items = [...list.children];

      const render = (ms) => {
        const progress = Math.min(ms / playMs, 1);
        const current = Math.floor(progress * steps.length);
        for (const [i, item] of items.entries()) {
          item.className = i < current ? "ok" : i === current ? "running" : "";
        }
        const seconds = Math.round(progress * runSeconds);
        document.getElementById("clock").textContent =
          `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")}`;
        document.getElementById("fill").style.width = `${progress * 100}%`;
        document.getElementById("pct").textContent = `${Math.round(progress * 100)}%`;
        document.body.style.setProperty("--spin", `${(ms * 0.6) % 360}deg`);
        document.body.classList.toggle("done", progress === 1);
        document.getElementById("state").textContent =
          progress === 1 ? "agent finished" : "agent running";
        return progress < 1;
      };

      const start = performance.now();
      const tick = () => render(performance.now() - start) && requestAnimationFrame(tick);
      tick();
    </script>
  </body>
</html>
