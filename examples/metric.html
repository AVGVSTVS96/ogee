<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Weekly active users</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=block"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background:
          radial-gradient(900px 500px at 85% 110%, rgb(124 92 255 / 0.28), transparent 70%), #09090b;
        color: #fafafa;
        font-family: Geist, system-ui, sans-serif;
        position: relative;
      }
      body::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgb(255 255 255 / 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgb(255 255 255 / 0.04) 1px, transparent 1px);
        background-size: 60px 60px;
      }
      main {
        position: relative;
        padding: 64px 72px;
      }
      .label {
        font-size: 34px;
        color: #a1a1aa;
        font-weight: 500;
      }
      .value {
        margin-top: 12px;
        font-size: 172px;
        font-weight: 600;
        letter-spacing: -0.05em;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }
      .delta {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-top: 24px;
        font-size: 32px;
        color: #a1a1aa;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 16px;
        border-radius: 999px;
        background: rgb(34 197 94 / 0.14);
        color: #4ade80;
        font-weight: 600;
      }
      svg.chart {
        position: absolute;
        right: 0;
        bottom: 0;
        width: 1200px;
        height: 420px;
      }
      footer {
        position: absolute;
        left: 72px;
        bottom: 56px;
        font-family: "Geist Mono", ui-monospace, monospace;
        font-size: 26px;
        color: #71717a;
      }
    </style>
  </head>
  <body>
    <svg class="chart" viewBox="0 0 1200 420" preserveAspectRatio="none">
      <defs>
        <linearGradient id="fill" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0" stop-color="#7c5cff" stop-opacity="0.45" />
          <stop offset="1" stop-color="#7c5cff" stop-opacity="0" />
        </linearGradient>
      </defs>
      <path id="area" fill="url(#fill)" />
      <path id="line" fill="none" stroke="#a78bfa" stroke-width="4" stroke-linejoin="round" />
      <circle id="dot" r="9" fill="#fafafa" stroke="#7c5cff" stroke-width="5" />
    </svg>
    <main>
      <p class="label">Weekly active users</p>
      <p class="value">48,213</p>
      <p class="delta">
        <span class="pill">
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
          >
            <path d="M7 17 17 7M9 7h8v8" />
          </svg>
          12.4%
        </span>
        vs last week
      </p>
    </main>
    <footer>last 16 weeks</footer>
    <script>
      const data = [31, 33, 32, 35, 34, 37, 36, 39, 38, 41, 40, 43, 42.9, 46, 45.1, 48.2];
      const [w, h, padTop, left] = [1200, 420, 40, 560];
      const lo = Math.min(...data);
      const hi = Math.max(...data);
      const points = data.map((v, i) => [
        left + ((w - left - 40) * i) / (data.length - 1),
        padTop + (h - padTop - 20) * (1 - (v - lo) / (hi - lo)),
      ]);
      const line = points.map(([x, y], i) => `${i ? "L" : "M"}${x},${y}`).join("");
      const [lastX, lastY] = points.at(-1);
      document.getElementById("line").setAttribute("d", line);
      document.getElementById("area").setAttribute("d", `${line}L${lastX},${h}L${left},${h}Z`);
      document.getElementById("dot").setAttribute("cx", lastX);
      document.getElementById("dot").setAttribute("cy", lastY);
    </script>
  </body>
</html>
